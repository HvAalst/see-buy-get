# SeeBuyGet Driver — build settings (2026-11-02). Nothing secret is ever written here: the upload key and its passwords
# are GitHub secrets, read by the workflow (README.md, "Signing").

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# The libraries are AndroidX; the plugin refuses them without this.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# WHERE THE APP POINTS: the public site, by its name only (no https://, no path). The Driver app is opened at
# https://<sbgHost>/driver/?app=android, and its API is https://<sbgHost>/v1/sbg. The workflow passes the repository's
# SBG_PUBLIC_URL instead when that variable is set, so this is the fallback (04_platform/.env.cloud.example names it).
sbgHost=seebuyget.com

# FIREBASE, the project's PUBLIC Android settings (Firebase console -> Project settings -> Your apps -> the Android app).
# Not secrets: they are in every copy of the app. Empty, the app never registers for wake-ups and says "not ready yet" when
# Messages in the car is turned on — it never crashes. Put them here, or in the repository VARIABLES the workflow reads
# (SBG_FIREBASE_PROJECT_ID, SBG_FIREBASE_APP_ID, SBG_FIREBASE_API_KEY, SBG_FIREBASE_SENDER_ID), which win over these.
firebaseProjectId=
firebaseAppId=
firebaseApiKey=
firebaseSenderId=

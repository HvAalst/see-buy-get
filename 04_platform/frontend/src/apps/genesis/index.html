<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SeeBuyGet Send</title>
    <meta name="description" content="Send a parcel on the SeeBuyGet network." />

    <!-- S28 invite: the link-preview card WhatsApp/Telegram/etc. render when a `/send/?invite=…` link is
         shared. Generic + SeeBuyGet-branded here; per-inviter personalisation ("Join Hans") would need
         dynamic OG rendering on the real seebuyget.com (SSR), so it lives in the share TEXT instead. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SeeBuyGet" />
    <meta property="og:title" content="Join me on SeeBuyGet" />
    <meta property="og:description" content="Send, track and collect parcels — no address needed. Join with my invite." />
    <meta property="og:url" content="https://www.seebuyget.com" />
    <meta property="og:image" content="https://www.seebuyget.com/social-card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Light only: this app never renders a dark variant. -->
    <meta name="color-scheme" content="light" />
    <!-- The app's OWN top surface, not a brand colour. In standalone this paints the status bar
         directly above a white TopBar: a band of orange or indigo there would read as chrome, and would
         make orange mean "chrome" in a system where orange means "this one is chosen". The identity
         lives in the icon and the mark, not in a strip the OS paints. -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Installed / standalone chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SBG Send" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

    <!-- The web app manifest link is injected here by vite-plugin-pwa at build time. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SeeBuyGet Business</title>
    <meta name="description" content="Ship, import and clear goods on the SeeBuyGet network — for your whole team, each person with their own sign-in." />

    <!-- Light only, like every other app in this family: one palette, one system. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />

    <!-- A signed-in workplace: the front page is what search engines should read about business accounts. -->
    <meta name="robots" content="noindex, follow" />

    <!-- No manifest: this app does not install (see AppSpec.installable in vite.config.ts). -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

# On a server: production mode, HTTPS on 80/443 with certificates Caddy obtains itself, and log rotation.
# Chosen by COMPOSE_FILE in .env.cloud.example. Only `web` is reachable from outside; the API's port is not published.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    environment:
      # The server will not start until every secret in .env is set to its own random value.
      GLOS_ENV: production
      # An address typed to find the nearest shops: OpenStreetMap's own address service (the user, 2026-10-25), unless
      # .env names another. Light use only, as its rules ask: one ask a second, the app named (AddressSearchService).
      GLOS_GEOCODER_URL: ${GLOS_GEOCODER_URL:-https://nominatim.openstreetmap.org}
      # The database's password must be the server's own: refused if .env has none (deploy.sh makes one).
      DATABASE_URL: postgres://glos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/glos
    logging: *logging

  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    logging: *logging

  web:
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    logging: *logging

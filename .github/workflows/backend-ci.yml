name: backend-ci

on:
  push:
    paths:
      - '04_generated_sandbox/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - '04_generated_sandbox/backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_generated_sandbox/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 04_generated_sandbox/backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

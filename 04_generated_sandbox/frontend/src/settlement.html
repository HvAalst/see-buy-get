<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLOS · Money</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./components/components.css" />
  <style>
    .st { max-width: 480px; margin: 0 auto; padding: 20px; display: grid; gap: 18px; }
    .st__head { display: flex; align-items: center; justify-content: space-between; }
    .st__title { font-size: 1.5rem; color: var(--forest); margin: 0; }
    .st__panel { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: grid; gap: 14px; }
    .st__steps { display: flex; gap: 8px; }
    .st__ms { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); }
    .st__ms.is-frozen { border-left: 5px solid var(--danger); }
    .st__ms-icon { font-size: 1.6rem; }
    .st__ms-title { font-weight: 700; }
    .st__ms-amt { margin-left: auto; font-weight: 800; color: var(--forest); }
    .st__sub { color: var(--muted); font-size: 0.9rem; }
    .st__fee { color: var(--muted); font-size: 0.85rem; }
    .st__dispute { border-left: 5px solid var(--warn); }
    .st__msg--err { color: var(--danger); font-weight: 700; }
  </style>
</head>
<body>
  <main class="st" id="settlement"></main>
  <script type="module" src="./settlement.js"></script>
</body>
</html>

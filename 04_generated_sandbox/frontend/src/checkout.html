<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose your pick-up point</title>
  <link rel="stylesheet" href="./fonts.css" />
  <style>
    /* GLOS PUDO picker — the node a merchant embeds in its checkout. PostNL-inspired (glos_brand_palette):
       indigo primary, orange accent, multi-colour swoosh, Mulish, compact solid buttons. Framed as a
       widget dropped onto the store's own checkout page (the grey "store" chrome around the white card). */
    :root {
      --pnl-indigo: #4c46e0; --pnl-indigo-dk: #3a34c2;
      --pnl-orange: #ff6200; --pnl-orange-dk: #dc4405;
      --pnl-navy: #172b6b; --pnl-green: #1fa45a; --pnl-amber: #ffab00;
      --pnl-ink: #1a1a1a; --pnl-muted: #5a5a64;
      --pnl-panel: #f2f2f4; --pnl-border: #e2e2e6; --pnl-border-strong: #c9c9d0;
      --pnl-font: 'PostNL', 'Mulish', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #e9e9ee; font-family: var(--pnl-font); color: var(--pnl-ink); -webkit-font-smoothing: antialiased; }
    .store { max-width: 760px; margin: 0 auto; padding: 0 16px 56px; }
    .store__chrome { display: flex; align-items: center; justify-content: space-between; padding: 16px 4px; color: var(--pnl-muted); font-size: 0.85rem; }
    .store__logo { font-weight: 800; color: var(--pnl-ink); font-size: 1.05rem; }
    .ck { background: #fff; border: 1px solid var(--pnl-border); border-radius: 16px; padding: 22px; box-shadow: 0 6px 24px rgba(20,20,40,0.08); }
    .ck::before { content: ''; display: block; height: 6px; border-radius: 999px; background: linear-gradient(90deg, var(--pnl-amber) 0%, var(--pnl-orange) 30%, var(--pnl-orange-dk) 44%, var(--pnl-indigo) 72%, var(--pnl-green) 100%); margin-bottom: 18px; }
    .ck__powered { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--pnl-muted); margin-bottom: 4px; }
    .ck__powered b { color: var(--pnl-indigo); }
    .ck__h { font-size: 1.3rem; font-weight: 800; color: #172b6b; letter-spacing: -0.01em; margin: 0 0 4px; }
    .ck__hint { color: var(--pnl-muted); font-size: 0.9rem; line-height: 1.45; margin: 0 0 16px; }

    .ck__summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--pnl-panel); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
    .ck__summary-l { font-size: 0.85rem; color: var(--pnl-muted); }
    .ck__summary-v { font-size: 1.05rem; font-weight: 800; }
    .ck__ship { font-weight: 800; }
    .ck__ship--free { color: var(--pnl-green); }

    .ck__field { display: grid; gap: 6px; margin-bottom: 14px; }
    .ck__label { font-weight: 800; color: #172b6b; font-size: 0.82rem; }
    .ck__input { min-height: 52px; padding: 13px 16px; font-size: 1.02rem; font-family: inherit; border: 1.5px solid #c9c9d0; border-radius: 10px; width: 100%; }
    .ck__input:focus { outline: none; border-color: #4c46e0; box-shadow: 0 0 0 3px rgba(76,70,224,0.16); }

    .ck__map { position: relative; border: 1.5px solid var(--pnl-border-strong); border-radius: 12px; overflow: hidden; background:
      repeating-linear-gradient(0deg, #f6f7f9 0 23px, #eef0f3 23px 24px),
      repeating-linear-gradient(90deg, #f6f7f9 0 23px, #eef0f3 23px 24px); }
    .ck__surface { position: relative; width: 100%; height: 240px; }
    .ck__dot { position: absolute; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 999px; border: 2.5px solid #fff; background: var(--pnl-indigo); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.25); display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 800; }
    .ck__dot--on { background: var(--pnl-orange); width: 30px; height: 30px; z-index: 3; }
    .ck__tag { position: absolute; transform: translate(-50%, 14px); background: #fff; border: 1px solid var(--pnl-border-strong); border-radius: 999px; padding: 1px 7px; font-size: 0.72rem; font-weight: 800; color: var(--pnl-indigo); white-space: nowrap; pointer-events: none; box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
    .ck__tail { margin-top: 14px; border: 1px solid var(--pnl-border); border-radius: 12px; padding: 12px 14px; background: var(--pnl-panel); }
    .ck__tail-node { display: flex; justify-content: space-between; font-size: 0.86rem; font-weight: 700; }
    .ck__tail-leg { color: var(--pnl-muted); font-size: 0.76rem; padding: 2px 0 2px 4px; }
    .ck__tail-sum { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--pnl-border-strong); font-weight: 800; font-size: 0.84rem; color: var(--pnl-indigo); }
    .ck__list { margin-top: 12px; display: grid; gap: 8px; }
    .ck__pudo { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1.5px solid var(--pnl-border); border-radius: 10px; padding: 10px 13px; cursor: pointer; text-align: left; background: #fff; font-family: inherit; }
    .ck__pudo:hover { border-color: var(--pnl-indigo); }
    .ck__pudo--on { border-color: var(--pnl-orange); background: rgba(255,98,0,0.06); }
    .ck__pudo-name { font-weight: 700; font-size: 0.92rem; }
    .ck__pudo-sub { font-size: 0.78rem; color: var(--pnl-muted); }
    .ck__pudo-km { font-size: 0.78rem; color: var(--pnl-muted); font-weight: 700; white-space: nowrap; }

    .ck__btn { min-height: 48px; padding: 13px 20px; border-radius: 10px; border: none; background: #4c46e0; color: #fff; font-weight: 800; font-size: 1rem; cursor: pointer; font-family: inherit; width: 100%; margin-top: 18px; }
    .ck__btn:hover { background: #3a34c2; }
    .ck__btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .ck__err { background: rgba(220,68,5,0.12); color: var(--pnl-orange-dk); padding: 11px 14px; border-radius: 9px; font-weight: 700; margin-bottom: 14px; }

    .ck__done { text-align: center; padding: 14px 6px; }
    .ck__done-ic { width: 64px; height: 64px; border-radius: 999px; background: rgba(31,164,90,0.14); color: var(--pnl-green); display: grid; place-items: center; font-size: 2rem; margin: 6px auto 14px; }
    .ck__done-card { background: var(--pnl-panel); border-radius: 12px; padding: 14px 16px; text-align: left; margin-top: 14px; font-size: 0.9rem; }
    .ck__done-card b { color: var(--pnl-indigo); }
  </style>
</head>
<body>
  <div class="store" id="checkout"></div>
  <script type="module" src="./checkout.js"></script>
</body>
</html>

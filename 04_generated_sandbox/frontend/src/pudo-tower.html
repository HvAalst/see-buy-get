<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PUDO · Control Tower</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./components/components.css" />
  <style>
    /* PUDO Control Tower — operator console (Compendium Ch 14). Admin-grade, continuous-monitoring
       dark theme matching the GLOS control tower: 60-30-10 colour budget, one sans family at three
       sizes, weight-driven hierarchy, tabular figures, F-pattern (critical top-left), subtle pulse. */
    :root {
      --bg: #14171c; --surface: #1b2026; --panel-2: #20262e; --border: #2a313b; --border-soft: #232a32;
      --text: #e7ebf0; --muted: #98a3b0; --dim: #69737f; --forest: #d6dde4;
      --brand: #4d6f8e; --brand-dark: #3e5b76; --brand-bright: #5b7a93; --slate: #5b7a93; --info-bg: rgba(77,111,142,0.16);
      --danger: #e5484d; --danger-bg: rgba(229,72,77,0.14); --warn: #e2a13a; --warn-bg: rgba(226,161,58,0.14);
      --success: #3fb27f; --success-bg: rgba(63,178,127,0.14); --gold: #c9a227;
      --radius: 8px; --fs-kpi: 28px; --fs-head: 12.5px; --fs-base: 11px;
      --font-sans: 'Segoe UI', Roboto, 'Open Sans', Arial, Tahoma, sans-serif; --font-mono: 'SF Mono', Consolas, monospace;
    }
    html, body { background: var(--bg); }
    body { color-scheme: dark; }
    .pt { max-width: 1280px; margin: 0 auto; padding: 16px 22px 56px; font-family: var(--font-sans); font-size: var(--fs-base); color: var(--text); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
    .pt__bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
    .pt__title { font-size: var(--fs-head); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; margin: 0; }
    .pt__sub { color: var(--slate); font-weight: 600; font-size: var(--fs-head); }
    .pt__btn { padding: 9px 15px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); font-weight: 600; font-size: var(--fs-base); cursor: pointer; }
    .pt__kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 18px; }
    .pt__kpi { position: relative; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--slate); border-radius: var(--radius); padding: 14px 16px; }
    .pt__kpi-num { font-size: var(--fs-kpi); font-weight: 700; line-height: 1.05; }
    .pt__kpi-label { color: var(--muted); font-size: var(--fs-base); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; font-weight: 600; }
    .pt__kpi.is-risk { border-left-color: var(--danger); }
    .pt__kpi.is-risk .pt__kpi-num { color: var(--danger); }
    .pt__kpi.is-risk::after { content: ''; position: absolute; top: 14px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: pt-pulse 2.2s ease-in-out infinite; }
    @keyframes pt-pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .pt__kpi.is-risk::after { animation: none; } }
    .pt__grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; align-items: start; }
    @media (max-width: 980px) { .pt__grid, .pt__kpis { grid-template-columns: 1fr 1fr; } }
    .pt__panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 18px; }
    .pt__panel-h { display: flex; align-items: center; justify-content: space-between; margin: 0 0 14px; }
    .pt__panel-title { font-size: var(--fs-head); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin: 0; }
    .pt__panel-hint { color: var(--dim); font-size: var(--fs-base); }
    .pt__map { width: 100%; height: 260px; background: var(--panel-2); border-radius: 6px; border: 1px solid var(--border-soft); position: relative; }
    .pt__legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: var(--fs-base); }
    .pt__sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .pt__table { width: 100%; border-collapse: collapse; font-size: var(--fs-base); }
    .pt__table th { text-align: left; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .pt__table td { padding: 9px 10px; border-bottom: 1px solid var(--border-soft); }
    .pt__mono { font-family: var(--font-mono); color: var(--muted); }
    .pt__chip { display: inline-block; padding: 2px 9px; border-radius: 4px; font-size: var(--fs-base); font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
    .pt__chip--ok { background: var(--success-bg); color: var(--success); }
    .pt__chip--warn { background: var(--warn-bg); color: var(--warn); }
    .pt__chip--bad { background: var(--danger-bg); color: var(--danger); }
    .pt__chip--info { background: var(--info-bg); color: var(--slate); }
    .pt__flag { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-left: 3px solid var(--danger); border-radius: 6px; margin-bottom: 8px; background: var(--panel-2); }
    .pt__flag-t { font-weight: 700; }
    .pt__flag-d { color: var(--muted); font-size: var(--fs-base); }
    .pt__input { padding: 9px 11px; font-size: var(--fs-base); border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); color: var(--text); }
    .pt__input:focus { outline: 2px solid var(--brand); }
    .pt__empty { text-align: center; color: var(--dim); padding: 18px; }
    .pt__scan { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--border-soft); align-items: center; }
  </style>
</head>
<body>
  <main class="pt" id="pudo-tower"></main>
  <script type="module" src="./pudo-tower.js"></script>
</body>
</html>

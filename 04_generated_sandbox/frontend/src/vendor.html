<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLOS · Merchant Console</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./components/components.css" />
  <link rel="stylesheet" href="./fonts.css" />
  <style>
    /* GLOS Merchant Console — PostNL-inspired (see glos_brand_palette): white canvas, indigo primary +
       orange accent, multi-colour swoosh, bold sentence-case headings, Mulish, compact solid buttons. */
    :root {
      --pnl-indigo: #4c46e0; --pnl-indigo-dk: #3a34c2;
      --pnl-orange: #ff6200; --pnl-orange-dk: #dc4405;
      --pnl-navy: #172b6b; --pnl-green: #1fa45a; --pnl-amber: #ffab00;
      --pnl-ink: #1a1a1a; --pnl-muted: #5a5a64;
      --pnl-panel: #f2f2f4; --pnl-border: #e2e2e6; --pnl-border-strong: #c9c9d0;
      --pnl-font: 'PostNL', 'Mulish', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    html, body { background: #ffffff; margin: 0; }
    .vn { max-width: 1140px; margin: 0 auto; padding: 0 24px 64px; color: var(--pnl-ink); font-family: var(--pnl-font); -webkit-font-smoothing: antialiased; }
    .vn::before { content: ''; display: block; height: 7px; border-radius: 999px; background: linear-gradient(90deg, var(--pnl-amber) 0%, var(--pnl-orange) 30%, var(--pnl-orange-dk) 44%, var(--pnl-indigo) 72%, var(--pnl-green) 100%); margin: 26px 0 20px; }
    .vn__bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px solid var(--pnl-border); margin-bottom: 22px; }
    .vn__brand { display: flex; flex-direction: column; gap: 3px; }
    .vn__title { font-size: 1.7rem; font-weight: 900; letter-spacing: -0.01em; color: #172b6b; margin: 0; }
    .vn__sub { color: var(--pnl-muted); font-size: 0.95rem; }
    .vn__who { text-align: right; font-size: 0.88rem; color: var(--pnl-muted); }
    .vn__who b { color: var(--pnl-indigo); }

    .vn__grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; align-items: start; }
    @media (max-width: 900px) { .vn__grid { grid-template-columns: 1fr; } }
    .vn__card { background: #fff; border: 1px solid var(--pnl-border); border-radius: 14px; padding: 22px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(20,20,40,0.04); }
    .vn__card-h { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; color: #172b6b; margin: 0 0 4px; }
    .vn__card-hint { color: var(--pnl-muted); font-size: 0.9rem; line-height: 1.45; margin: 0 0 16px; }

    .vn__field { display: grid; gap: 6px; margin-bottom: 14px; }
    .vn__label { font-weight: 800; color: #172b6b; font-size: 0.82rem; }
    .vn__input, .vn__select { min-height: 52px; padding: 13px 16px; font-size: 1.02rem; font-family: inherit; border: 1.5px solid #c9c9d0; border-radius: 10px; background: #fff; color: var(--pnl-ink); width: 100%; }
    .vn__input:focus, .vn__select:focus { outline: none; border-color: #4c46e0; box-shadow: 0 0 0 3px rgba(76,70,224,0.16); }
    .vn__select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #5a5a64 50%), linear-gradient(135deg, #5a5a64 50%, transparent 50%); background-position: calc(100% - 20px) calc(50% - 2px), calc(100% - 14px) calc(50% - 2px); background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
    .vn__row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .vn__btn { min-height: 46px; padding: 11px 20px; border-radius: 10px; border: none; background: #4c46e0; color: #fff; font-weight: 800; font-size: 0.95rem; cursor: pointer; font-family: inherit; }
    .vn__btn:hover { background: #3a34c2; }
    .vn__btn--ghost { background: #fff; color: #4c46e0; border: 1.5px solid #4c46e0; }
    .vn__btn--ghost:hover { background: rgba(76,70,224,0.06); border-color: var(--pnl-indigo); }
    .vn__btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .vn__btns { display: flex; gap: 10px; flex-wrap: wrap; }

    .vn__item-row { display: grid; grid-template-columns: 1fr 80px auto; gap: 8px; margin-bottom: 8px; align-items: center; }
    .vn__x { border: 1.5px solid var(--pnl-border-strong); background: #fff; border-radius: 8px; width: 38px; height: 38px; cursor: pointer; color: var(--pnl-orange-dk); font-weight: 800; }

    .vn__cred { display: grid; grid-template-columns: 130px 1fr; gap: 8px 14px; font-size: 0.9rem; align-items: center; }
    .vn__cred dt { color: var(--pnl-muted); font-weight: 700; }
    .vn__cred dd { margin: 0; font-family: 'SF Mono', Consolas, monospace; font-size: 0.84rem; word-break: break-all; }
    .vn__reveal { background: none; border: none; color: var(--pnl-indigo); font-weight: 700; cursor: pointer; padding: 0; font: inherit; text-decoration: underline; }

    .vn__label-out { border: 1.5px dashed var(--pnl-indigo); border-radius: 12px; padding: 16px; text-align: center; background: rgba(76,70,224,0.05); }
    .vn__label-out svg { max-width: 100%; height: auto; background: #fff; border-radius: 6px; }
    .vn__code { font-family: 'SF Mono', Consolas, monospace; font-size: 1.25rem; font-weight: 800; color: var(--pnl-indigo); letter-spacing: 0.08em; }

    .vn__table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .vn__table th { text-align: left; color: var(--pnl-muted); font-weight: 700; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.04em; padding: 8px; border-bottom: 2px solid var(--pnl-border); }
    .vn__table td { padding: 10px 8px; border-bottom: 1px solid var(--pnl-border); vertical-align: middle; }
    .vn__mono { font-family: 'SF Mono', Consolas, monospace; font-size: 0.8rem; color: var(--pnl-muted); }
    .vn__pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; }
    .vn__pill--created { background: var(--pnl-panel); color: var(--pnl-muted); }
    .vn__pill--move { background: rgba(76,70,224,0.12); color: var(--pnl-indigo); }
    .vn__pill--ready { background: rgba(255,171,0,0.20); color: #9a6a00; }
    .vn__pill--done { background: rgba(31,164,90,0.14); color: var(--pnl-green); }
    .vn__pill--bad { background: rgba(220,68,5,0.12); color: var(--pnl-orange-dk); }
    .vn__msg { padding: 12px 15px; border-radius: 9px; font-weight: 700; margin-bottom: 16px; }
    .vn__msg--ok { background: rgba(31,164,90,0.14); color: var(--pnl-green); }
    .vn__msg--err { background: rgba(220,68,5,0.12); color: var(--pnl-orange-dk); }
    .vn__empty { text-align: center; color: var(--pnl-muted); padding: 18px; font-size: 0.92rem; }
    .vn__doc { color: var(--pnl-indigo); font-weight: 700; text-decoration: none; font-size: 0.85rem; }

    /* tabs */
    .vn__tabs { display: flex; gap: 6px; background: var(--pnl-panel); padding: 5px; border-radius: 11px; margin-bottom: 22px; width: fit-content; }
    .vn__tab { border: none; background: none; padding: 9px 18px; border-radius: 8px; font: inherit; font-weight: 700; color: var(--pnl-muted); cursor: pointer; }
    .vn__tab--on { background: #fff; color: var(--pnl-indigo); box-shadow: 0 1px 3px rgba(20,20,40,0.10); }

    /* mini map + PUDO dots */
    .vn__map { position: relative; border: 1.5px solid var(--pnl-border-strong); border-radius: 12px; overflow: hidden; background:
      repeating-linear-gradient(0deg, #f6f7f9 0 23px, #eef0f3 23px 24px),
      repeating-linear-gradient(90deg, #f6f7f9 0 23px, #eef0f3 23px 24px); }
    .vn__surface { position: relative; width: 100%; height: 200px; cursor: crosshair; }
    .vn__dot { position: absolute; transform: translate(-50%, -50%); width: 20px; height: 20px; border-radius: 999px; border: 2.5px solid #fff; background: var(--pnl-indigo); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.25); display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 800; }
    .vn__dot--on { background: var(--pnl-orange); width: 27px; height: 27px; z-index: 3; }
    .vn__tag { position: absolute; transform: translate(-50%, 13px); background: #fff; border: 1px solid var(--pnl-border-strong); border-radius: 999px; padding: 1px 7px; font-size: 0.7rem; font-weight: 800; color: var(--pnl-indigo); white-space: nowrap; pointer-events: none; box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
    .vn__tail { margin-top: 10px; border: 1px solid var(--pnl-border); border-radius: 10px; padding: 11px 13px; background: var(--pnl-panel); }
    .vn__tail-node { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; }
    .vn__tail-leg { color: var(--pnl-muted); font-size: 0.75rem; padding: 2px 0 2px 4px; }
    .vn__tail-sum { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--pnl-border-strong); font-weight: 800; font-size: 0.82rem; color: var(--pnl-indigo); }
    .vn__pin { position: absolute; transform: translate(-50%, -100%); font-size: 22px; z-index: 4; }
    .vn__maplist { margin-top: 10px; display: grid; gap: 7px; }
    .vn__pudo-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1.5px solid var(--pnl-border); border-radius: 10px; padding: 9px 12px; cursor: pointer; text-align: left; background: #fff; font-family: inherit; }
    .vn__pudo-row:hover { border-color: var(--pnl-indigo); }
    .vn__pudo-row--on { border-color: var(--pnl-orange); background: rgba(255,98,0,0.06); }
    .vn__pudo-km { font-size: 0.78rem; color: var(--pnl-muted); font-weight: 700; white-space: nowrap; }

    /* derived size + dimensions */
    .vn__seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .vn__size { display: flex; align-items: center; gap: 10px; background: var(--pnl-panel); border-radius: 10px; padding: 10px 14px; margin-top: 4px; }
    .vn__size-chip { font-weight: 800; font-size: 0.95rem; padding: 4px 12px; border-radius: 999px; background: rgba(76,70,224,0.12); color: var(--pnl-indigo); }
    .vn__size-note { font-size: 0.82rem; color: var(--pnl-muted); }

    /* content photo */
    .vn__photo { display: flex; align-items: center; gap: 12px; }
    .vn__photo-btn { border: 1.5px dashed var(--pnl-border-strong); background: var(--pnl-panel); border-radius: 10px; padding: 11px 16px; font: inherit; font-weight: 700; color: var(--pnl-indigo); cursor: pointer; }
    .vn__thumb { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; border: 1px solid var(--pnl-border); }

    /* settlement / money */
    .vn__money { display: grid; gap: 6px; background: rgba(31,164,90,0.06); border: 1px solid rgba(31,164,90,0.25); border-radius: 10px; padding: 12px 14px; margin-top: 14px; font-size: 0.88rem; }
    .vn__money-row { display: flex; justify-content: space-between; }
    .vn__money-row b { font-weight: 800; }

    /* handoff inbox */
    .vn__handoff { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1.5px solid var(--pnl-border); border-radius: 11px; padding: 12px 14px; margin-bottom: 9px; }
    .vn__handoff--on { border-color: var(--pnl-orange); background: rgba(255,98,0,0.05); }
    .vn__handoff-em { font-weight: 700; font-size: 0.9rem; }
    .vn__handoff-sub { font-size: 0.78rem; color: var(--pnl-muted); }

    /* order detail */
    .vn__kv { display: grid; grid-template-columns: 150px 1fr; gap: 8px 14px; font-size: 0.9rem; align-items: start; }
    .vn__kv dt { color: var(--pnl-muted); font-weight: 700; }
    .vn__kv dd { margin: 0; }
    .vn__detail-photo { max-width: 160px; border-radius: 10px; border: 1px solid var(--pnl-border); }
    .vn__back { background: none; border: none; color: var(--pnl-indigo); font-weight: 700; cursor: pointer; font: inherit; padding: 0; margin-bottom: 12px; }
    .vn__rowclick { cursor: pointer; }
    .vn__rowclick:hover { background: rgba(76,70,224,0.04); }
  </style>
</head>
<body>
  <main class="vn" id="vendor"></main>
  <script type="module" src="./vendor.js"></script>
</body>
</html>

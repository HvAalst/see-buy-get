<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLOS · Fleet Console</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./components/components.css" />
  <link rel="stylesheet" href="./fonts.css" />
  <style>
    /* GLOS Fleet Console — PostNL-inspired (see glos_brand_palette): white canvas, indigo primary +
       orange accent, multi-colour swoosh, a large icon-over-label tab bar, bold sentence-case headings,
       Mulish, compact solid buttons. (Dark ops towers keep their own theme.) */
    :root {
      --pnl-indigo: #4c46e0; --pnl-indigo-dk: #3a34c2;
      --pnl-orange: #ff6200; --pnl-orange-dk: #dc4405;
      --pnl-navy: #172b6b; --pnl-green: #1fa45a; --pnl-amber: #ffab00;
      --pnl-ink: #1a1a1a; --pnl-muted: #5a5a64; --pnl-bg: #ffffff;
      --pnl-panel: #f2f2f4; --pnl-border: #e2e2e6; --pnl-border-strong: #c9c9d0;
      --pnl-font: 'PostNL', 'Mulish', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    html, body { background: var(--pnl-bg); margin: 0; }
    .fl { max-width: 1180px; margin: 0 auto; padding: 0 24px 64px; color: var(--pnl-ink); font-family: var(--pnl-font); -webkit-font-smoothing: antialiased; }

    /* Header: swoosh + title/who + controls, then the tab bar */
    .fl__head { padding-top: 26px; margin-bottom: 24px; }
    .fl__swoosh { height: 7px; border-radius: 999px; background: linear-gradient(90deg, var(--pnl-amber) 0%, var(--pnl-orange) 30%, var(--pnl-orange-dk) 44%, var(--pnl-indigo) 72%, var(--pnl-green) 100%); margin-bottom: 20px; }
    .fl__bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .fl__brand { display: flex; flex-direction: column; gap: 3px; }
    .fl__title { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.01em; color: #172b6b; margin: 0; }
    .fl__who { display: flex; align-items: center; gap: 6px; color: var(--pnl-muted); font-size: 0.92rem; }
    .fl__who b { color: var(--pnl-indigo); }
    .fl__controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .fl__btn { padding: 9px 16px; border-radius: 10px; border: 1.5px solid #4c46e0; background: #fff; color: #4c46e0; font-weight: 800; font-size: 0.9rem; cursor: pointer; font-family: inherit; }
    .fl__btn:hover { border-color: var(--pnl-indigo); color: var(--pnl-indigo); }

    /* Large icon-over-label tab bar */
    .fl__tabs { display: flex; background: var(--pnl-panel); border: 1px solid var(--pnl-border); border-radius: 14px; overflow: hidden; }
    .fl__tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 9px; padding: 18px 10px; background: transparent; border: none; border-left: 1px solid var(--pnl-border); cursor: pointer; font-family: inherit; transition: background 120ms; }
    .fl__tab:first-child { border-left: none; }
    .fl__tab:hover:not(.is-on) { background: rgba(20,20,40,0.03); }
    .fl__tab-ic svg { width: 26px; height: 26px; stroke: var(--pnl-indigo); stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .fl__tab-l { font-size: 0.98rem; font-weight: 800; color: var(--pnl-indigo); }
    .fl__tab.is-on { background: #fff; box-shadow: inset 0 -3px 0 var(--pnl-orange); }
    .fl__tab.is-on .fl__tab-ic svg { stroke: var(--pnl-orange); }
    .fl__tab.is-on .fl__tab-l { color: var(--pnl-orange); }

    .fl__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    @media (max-width: 920px) { .fl__grid { grid-template-columns: 1fr; } }
    .fl__card { background: #fff; border: 1px solid var(--pnl-border); border-radius: 14px; padding: 22px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(20,20,40,0.04); }
    .fl__card-h { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; color: #172b6b; margin: 0 0 4px; }
    .fl__card-hint { color: var(--pnl-muted); font-size: 0.9rem; line-height: 1.45; margin: 0 0 16px; }

    .fl__field { display: grid; gap: 6px; margin-bottom: 14px; }
    .fl__label { font-weight: 800; color: #172b6b; font-size: 0.82rem; }
    .fl__input, .fl__select { min-height: 52px; padding: 13px 16px; font-size: 1.02rem; font-family: inherit; border: 1.5px solid #c9c9d0; border-radius: 10px; background: #fff; color: var(--pnl-ink); width: 100%; }
    .fl__input:focus, .fl__select:focus { outline: none; border-color: #4c46e0; box-shadow: 0 0 0 3px rgba(76,70,224,0.16); }
    .fl__select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #5a5a64 50%), linear-gradient(135deg, #5a5a64 50%, transparent 50%); background-position: calc(100% - 20px) calc(50% - 2px), calc(100% - 14px) calc(50% - 2px); background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
    .fl__row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Compact solid-indigo primary; ghost + status actions */
    .fl__btn-primary { min-height: 46px; padding: 11px 22px; border-radius: 10px; border: none; background: #4c46e0; color: #fff; font-weight: 800; font-size: 0.95rem; cursor: pointer; font-family: inherit; }
    .fl__btn-primary:hover { background: #3a34c2; }
    .fl__btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .fl__act { padding: 6px 12px; border-radius: 7px; border: 1.5px solid var(--pnl-border-strong); background: #fff; font-weight: 700; cursor: pointer; font-size: 0.8rem; color: var(--pnl-indigo); font-family: inherit; }
    .fl__act:hover { border-color: var(--pnl-indigo); }
    .fl__act--go { border-color: var(--pnl-green); color: var(--pnl-green); }
    .fl__act--no { border-color: var(--pnl-orange-dk); color: var(--pnl-orange-dk); }

    .fl__chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .fl__chip { padding: 8px 13px; border-radius: 999px; border: 1.5px solid var(--pnl-border-strong); background: #fff; font-weight: 700; cursor: pointer; font-size: 0.86rem; color: var(--pnl-muted); text-transform: capitalize; font-family: inherit; }
    .fl__chip.is-on { border-color: var(--pnl-indigo); background: rgba(76,70,224,0.08); color: var(--pnl-indigo); }

    .fl__table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .fl__table th { text-align: left; color: var(--pnl-muted); font-weight: 700; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.04em; padding: 8px; border-bottom: 2px solid var(--pnl-border); }
    .fl__table td { padding: 10px 8px; border-bottom: 1px solid var(--pnl-border); vertical-align: middle; }
    .fl__mono { font-family: 'SF Mono', Consolas, monospace; font-size: 0.8rem; color: var(--pnl-muted); }
    .fl__pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; }
    .fl__pill--ok { background: rgba(31,164,90,0.14); color: var(--pnl-green); }
    .fl__pill--warn { background: rgba(255,171,0,0.20); color: #9a6a00; }
    .fl__pill--info { background: rgba(76,70,224,0.12); color: var(--pnl-indigo); }
    .fl__pill--bad { background: rgba(220,68,5,0.12); color: var(--pnl-orange-dk); }
    .fl__msg { padding: 12px 15px; border-radius: 9px; font-weight: 700; margin-bottom: 18px; }
    .fl__msg--ok { background: rgba(31,164,90,0.14); color: var(--pnl-green); }
    .fl__msg--err { background: rgba(220,68,5,0.12); color: var(--pnl-orange-dk); }
    .fl__empty { text-align: center; color: var(--pnl-muted); padding: 18px; font-size: 0.92rem; }

    /* KPI tiles */
    .fl__kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 22px; }
    @media (max-width: 900px) { .fl__kpis { grid-template-columns: repeat(2, 1fr); } }
    .fl__kpi { background: #fff; border: 1px solid var(--pnl-border); border-left: 4px solid var(--pnl-indigo); border-radius: 12px; padding: 16px 18px; }
    .fl__kpi-v { font-size: 1.8rem; font-weight: 800; color: var(--pnl-ink); line-height: 1.05; }
    .fl__kpi-l { color: var(--pnl-muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 6px; font-weight: 700; }

    /* GPS map */
    .fl__map { width: 100%; height: 300px; background: #eef0fb; border-radius: 12px; border: 1px solid var(--pnl-border); position: relative; overflow: hidden; }
    .fl__dot { position: absolute; transform: translate(-50%, -50%); width: 14px; height: 14px; border-radius: 50%; background: var(--pnl-indigo); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.3); cursor: pointer; }
    .fl__dot-l { position: absolute; transform: translate(-50%, -140%); font-size: 0.7rem; font-weight: 700; color: var(--pnl-ink); background: rgba(255,255,255,0.9); padding: 1px 5px; border-radius: 4px; white-space: nowrap; }

    /* Shortcuts */
    .fl__shortcuts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    @media (max-width: 760px) { .fl__shortcuts { grid-template-columns: 1fr; } }
    .fl__shortcut { background: #fff; border: 1px solid var(--pnl-border); border-radius: 12px; padding: 18px; cursor: pointer; text-align: left; transition: box-shadow 140ms, border-color 140ms; font-family: inherit; }
    .fl__shortcut:hover { border-color: var(--pnl-indigo); box-shadow: 0 6px 18px rgba(20,20,40,0.08); }
    .fl__shortcut-t { font-weight: 800; color: var(--pnl-indigo); font-size: 1.05rem; }
    .fl__shortcut-s { color: var(--pnl-muted); font-size: 0.86rem; margin-top: 4px; }

    .fl__caps { display: flex; flex-wrap: wrap; gap: 4px; }
    .fl__cap { font-size: 0.68rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: rgba(76,70,224,0.1); color: var(--pnl-indigo); text-transform: uppercase; letter-spacing: 0.03em; }

    /* Sign-in */
    .fl__login { max-width: 460px; margin: 7vh auto 0; }
    .fl__login::before { content: ''; display: block; height: 7px; border-radius: 999px; background: linear-gradient(90deg, var(--pnl-amber), var(--pnl-orange) 32%, var(--pnl-indigo) 72%, var(--pnl-green)); margin-bottom: 22px; }
    .fl__login-brand { text-align: center; margin-bottom: 18px; }
    .fl__login-brand h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.01em; color: #172b6b; margin: 0; }
    .fl__login-brand p { color: var(--pnl-muted); font-size: 1rem; margin: 6px 0 0; }
    .fl__or { text-align: center; color: var(--pnl-muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; margin: 16px 0; }
  </style>
</head>
<body>
  <main class="fl" id="fleet"></main>
  <script type="module" src="./fleet.js"></script>
</body>
</html>

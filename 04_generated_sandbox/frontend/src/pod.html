<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLOS · Delivered</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./components/components.css" />
  <style>
    .pod { max-width: 480px; margin: 0 auto; padding: 20px; display: grid; gap: 18px; }
    .pod__head { display: flex; align-items: center; justify-content: space-between; }
    .pod__title { font-size: 1.5rem; color: var(--forest); margin: 0; }
    .pod__instruction { font-size: 1.15rem; color: var(--text); }
    .pod__panel { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; }
    .pod__sig { width: 100%; height: 160px; border: 2px dashed var(--azure); border-radius: var(--radius); background: var(--bg); touch-action: none; }
    .pod__sig-label { color: var(--muted); font-size: 0.9rem; }
    .pod__ok { font-size: 3rem; text-align: center; }
    .pod__ok-text { text-align: center; font-size: 1.4rem; font-weight: 800; color: var(--success); }
    .pod__did { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); word-break: break-all; }
    .pod__msg--err { color: var(--danger); font-weight: 700; }
  </style>
</head>
<body>
  <main class="pod" id="pod"></main>
  <script type="module" src="./pod.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PUDO · Agent</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./components/components.css" />
  <link rel="stylesheet" href="./fonts.css" />
  <style>
    /* PUDO Agent App — the shopkeeper's three tasks (Accept · Hand to bus · Release). PostNL-inspired
       (see glos_brand_palette): white canvas, indigo primary + orange accent, swoosh header, Mulish.
       Large targets kept for low-literacy use ([[glos_low_literacy_ux]]). */
    :root {
      --pnl-indigo: #4c46e0; --pnl-indigo-dk: #3a34c2; --pnl-orange: #ff6200; --pnl-orange-dk: #dc4405;
      --pnl-green: #1fa45a; --pnl-amber: #ffab00; --pnl-ink: #1a1a1a; --pnl-muted: #5a5a64;
      --pnl-border: #e2e2e6; --pnl-border-strong: #c9c9d0;
      --pnl-font: 'PostNL', 'Mulish', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    .ag { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #fff; font-family: var(--pnl-font); -webkit-font-smoothing: antialiased; }
    .ag__top { background: #fff; border-top: 4px solid; border-image: linear-gradient(90deg, var(--pnl-amber), var(--pnl-orange) 40%, var(--pnl-indigo) 75%, var(--pnl-green)) 1; border-bottom: 1px solid var(--pnl-border); padding: 13px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 5; }
    .ag__brand { font-weight: 800; letter-spacing: -0.01em; font-size: 1.15rem; color: #172b6b; }
    .ag__right { display: flex; align-items: center; gap: 14px; }
    .ag__hub { color: var(--pnl-indigo); font-weight: 700; font-size: 0.85rem; text-decoration: none; }
    .ag__status { display: inline-flex; align-items: center; gap: 7px; font-size: 0.8rem; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: rgba(76,70,224,0.1); color: var(--pnl-indigo); }
    .ag__status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pnl-green); }
    .ag__status-dot--off { background: var(--pnl-orange); }
    .ag__body { padding: 20px; display: grid; gap: 16px; }

    .ag__wallet { background: #fff; border: 1px solid var(--pnl-border); border-radius: 14px; padding: 20px; box-shadow: 0 1px 2px rgba(20,20,40,0.04); }
    .ag__wallet-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .ag__wallet .ws-amount__value { font-size: 2.2rem; color: var(--pnl-ink); font-weight: 800; }
    .ag__wallet .ws-amount__caption { color: var(--pnl-muted); font-size: 0.85rem; }
    .ag__topup { border: 1.5px solid #4c46e0; color: #4c46e0; background: #fff; font-weight: 800; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-size: 0.95rem; font-family: inherit; }
    .ag__notice { padding: 12px 16px; border-radius: 10px; font-weight: 700; font-size: 0.92rem; border-left: 4px solid; }
    .ag__notice--warn { background: rgba(255,171,0,0.18); color: #9a6a00; border-color: var(--pnl-amber); }
    .ag__notice--lock { background: rgba(220,68,5,0.1); color: var(--pnl-orange-dk); border-color: var(--pnl-orange-dk); }

    .ag__actions { display: grid; gap: 12px; }
    .ag__action { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; background: #fff; border: 1px solid var(--pnl-border); border-radius: 14px; padding: 18px; cursor: pointer; transition: border-color 120ms, box-shadow 120ms; }
    .ag__action:hover:not(:disabled) { border-color: var(--pnl-indigo); box-shadow: 0 4px 14px rgba(20,20,40,0.06); }
    .ag__action:disabled { opacity: 0.45; cursor: not-allowed; }
    .ag__action-ic { width: 46px; height: 46px; border-radius: 12px; background: rgba(255,98,0,0.12); display: grid; place-items: center; flex: none; }
    .ag__action-ic svg { width: 24px; height: 24px; stroke: var(--pnl-orange); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .ag__action-t { font-weight: 800; color: var(--pnl-ink); font-size: 1.05rem; }
    .ag__action-s { color: var(--pnl-muted); font-size: 0.85rem; margin-top: 2px; }

    .ag__card { background: #fff; border: 1px solid var(--pnl-border); border-radius: 14px; padding: 18px; display: grid; gap: 14px; box-shadow: 0 1px 2px rgba(20,20,40,0.04); }
    .ag__head { display: flex; align-items: center; gap: 12px; }
    .ag__back { border: 1.5px solid #4c46e0; background: #fff; border-radius: 10px; padding: 9px 14px; font-weight: 800; cursor: pointer; color: #4c46e0; font-family: inherit; }
    .ag__title { font-size: 1.2rem; font-weight: 800; color: #172b6b; letter-spacing: -0.01em; margin: 0; }
    .ag__step { display: grid; gap: 8px; }
    .ag__step-label { font-weight: 800; color: #172b6b; font-size: 0.9rem; }
    .ag__step-label b { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; background: var(--pnl-indigo); color: #fff; border-radius: 50%; font-size: 0.75rem; margin-right: 8px; }
    .ag__input { min-height: 54px; padding: 14px 16px; font-size: 1.05rem; border: 1.5px solid #c9c9d0; border-radius: 10px; width: 100%; background: #fff; color: var(--pnl-ink); font-family: inherit; }
    .ag__input:focus { outline: none; border-color: #4c46e0; box-shadow: 0 0 0 3px rgba(76,70,224,0.16); }
    select.ag__input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #5a5a64 50%), linear-gradient(135deg, #5a5a64 50%, transparent 50%); background-position: calc(100% - 20px) calc(50% - 2px), calc(100% - 14px) calc(50% - 2px); background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
    .ag__grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ag__chip { padding: 14px; border-radius: 10px; border: 1.5px solid var(--pnl-border-strong); background: #fff; font-weight: 700; cursor: pointer; color: var(--pnl-ink); }
    .ag__chip.is-on { border-color: var(--pnl-indigo); background: rgba(76,70,224,0.08); color: var(--pnl-indigo); }
    .ag__pick { display: grid; gap: 8px; }
    .ag__row { display: flex; align-items: center; gap: 12px; padding: 13px; border: 1.5px solid var(--pnl-border-strong); border-radius: 10px; cursor: pointer; background: #fff; }
    .ag__row.is-on { border-color: var(--pnl-indigo); background: rgba(76,70,224,0.08); }
    .ag__check { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--pnl-indigo); display: grid; place-items: center; color: var(--pnl-indigo); font-weight: 800; flex: none; }
    .ag__primary { width: 100%; padding: 15px; border: none; border-radius: 10px; background: #4c46e0; color: #fff; font-weight: 800; font-size: 1.05rem; cursor: pointer; font-family: inherit; }
    .ag__primary:hover { background: #3a34c2; }
    .ag__primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .ag__msg { padding: 13px 16px; border-radius: 10px; font-weight: 700; border-left: 4px solid; }
    .ag__msg--ok { background: rgba(31,164,90,0.14); color: var(--pnl-green); border-color: var(--pnl-green); }
    .ag__msg--err { background: rgba(220,68,5,0.1); color: var(--pnl-orange-dk); border-color: var(--pnl-orange-dk); }
    .ag__otp { font-size: 1.8rem; letter-spacing: 0.5em; text-align: center; font-family: 'SF Mono', Consolas, monospace; }
    .ag__stars { display: flex; gap: 10px; justify-content: center; padding: 6px 0; }
    .ag__star { font-size: 2rem; cursor: pointer; color: var(--pnl-border-strong); }
    .ag__star.is-on { color: var(--pnl-amber); }
    .ag__hint { font-family: 'SF Mono', Consolas, monospace; font-size: 0.78rem; color: var(--pnl-muted); text-align: center; }
  </style>
</head>
<body>
  <main class="ag" id="agent"></main>
  <script type="module" src="./agent.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLOS · Track</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./components/components.css" />
  <style>
    .tk { max-width: 480px; margin: 0 auto; padding: 20px; display: grid; gap: 18px; }
    .tk__head { display: flex; align-items: center; justify-content: space-between; }
    .tk__title { font-size: 1.5rem; color: var(--forest); margin: 0; }
    .tk__hero { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; text-align: center; }
    .tk__hero-icon { font-size: 3rem; }
    .tk__hero-status { font-size: 1.5rem; font-weight: 800; color: var(--forest); margin-top: 6px; }
    .tk__bar { height: 14px; border-radius: 999px; background: var(--border-soft); overflow: hidden; margin-top: 14px; }
    .tk__bar-fill { height: 100%; background: var(--brand-bright); border-radius: 999px; transition: width 240ms ease; }
    .tk__bar-label { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }
    .tk__steps { display: grid; gap: 10px; }
    .tk__step { display: flex; align-items: center; gap: 14px; padding: 14px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); }
    .tk__step.is-anomaly { border-left: 5px solid var(--danger); }
    .tk__step-icon { font-size: 1.8rem; }
    .tk__step-title { font-weight: 700; }
    .tk__step-meta { color: var(--muted); font-size: 0.9rem; }
    .tk__id { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); word-break: break-all; }
    .tk__msg--err { color: var(--danger); font-weight: 700; }
  </style>
</head>
<body>
  <main class="tk" id="tracking"></main>
  <script type="module" src="./tracking.js"></script>
</body>
</html>

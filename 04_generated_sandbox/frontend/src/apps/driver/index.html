<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SeeBuyGet Driver</title>
    <meta name="description" content="Claim, load and deliver work on the SeeBuyGet network." />

    <!-- Light only: this app never renders a dark variant. -->
    <meta name="color-scheme" content="light" />
    <!-- The app's OWN top surface, not a brand colour. In standalone this paints the status bar
         directly above a white TopBar: a band of orange or indigo there would read as chrome, and would
         make orange mean "chrome" in a system where orange means "this one is chosen". The identity
         lives in the icon and the mark, not in a strip the OS paints. -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Installed / standalone chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Driver" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

    <!-- The web app manifest link is injected here by vite-plugin-pwa at build time. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

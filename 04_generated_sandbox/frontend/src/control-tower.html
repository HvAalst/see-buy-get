<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLOS · Control Tower</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./components/components.css" />
  <style>
    /* ============================================================================================
       Control-room display (24/7 monitoring). Optimised for instant legibility, low cognitive
       fatigue and clear priority: dark non-glare theme, 60-30-10 colour budget, one sans-serif
       family at exactly three sizes, weight-driven hierarchy, tabular figures, F-pattern layout.
       Tokens override styles.css so the existing JS colour references remap to the dark palette.
       ============================================================================================ */
    :root {
      /* 60% — neutrals (dark grays) */
      --bg: #14171c;
      --surface: #1b2026;          /* panels / cards */
      --card: #1b2026;
      --panel-2: #20262e;
      --border: #2a313b;
      --border-soft: #232a32;
      --text: #e7ebf0;             /* high-contrast primary text */
      --muted: #98a3b0;            /* secondary text */
      --dim: #69737f;
      --forest: #d6dde4;           /* (legacy token) repurposed: light heading text on dark */

      /* 30% — primary muted blue / slate (base data) */
      --brand: #4d6f8e;
      --brand-dark: #3e5b76;
      --brand-bright: #5b7a93;     /* "on-track" indicator (calm, not alarming) */
      --slate: #5b7a93;
      --info-bg: rgba(77, 111, 142, 0.16);

      /* 10% — bold accents (alerts/anomalies only) */
      --danger: #e5484d;
      --danger-bg: rgba(229, 72, 77, 0.14);
      --warn: #e2a13a;
      --warn-bg: rgba(226, 161, 58, 0.14);
      --success: #3fb27f;          /* restrained green: delivered / greener-saving */
      --success-bg: rgba(63, 178, 127, 0.14);

      --radius: 8px;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);

      /* Three type sizes only. Hierarchy elsewhere comes from weight, case and colour. */
      --fs-kpi: 28px;
      --fs-head: 12.5px;
      --fs-base: 11px;
      --font-sans: 'Segoe UI', Roboto, 'Open Sans', Arial, Tahoma, sans-serif;
      --font-mono: 'SF Mono', 'Cascadia Mono', Consolas, monospace;
    }

    html, body { background: var(--bg); }
    body { color-scheme: dark; }

    .ct {
      max-width: 1320px; margin: 0 auto; padding: 16px 22px 56px;
      font-family: var(--font-sans);
      font-size: var(--fs-base);
      color: var(--text);
      /* Tabular figures everywhere so columns of digits line up vertically. */
      font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1;
      -webkit-font-smoothing: antialiased;
    }

    /* Top bar -------------------------------------------------------------------------------- */
    .ct__bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
    .ct__brand { display: flex; align-items: baseline; gap: 12px; }
    .ct__title { font-size: var(--fs-head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--text); margin: 0; font-weight: 700; }
    .ct__region { font-size: var(--fs-head); color: var(--slate); font-weight: 600; }
    .ct__bar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .ct__meta { color: var(--muted); font-size: var(--fs-base); text-align: right; font-variant-numeric: tabular-nums; }
    .ct__regions { display: flex; gap: 6px; }
    .ct__region-btn { padding: 6px 11px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--muted); font-weight: 600; font-size: var(--fs-base); letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; text-decoration: none; }
    .ct__region-btn.is-on { background: var(--brand); color: #fff; border-color: var(--brand); }

    /* KPI strip (F-pattern: critical first / top-left) --------------------------------------- */
    .ct__kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 18px; }
    .ct__kpi { position: relative; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--slate); border-radius: var(--radius); padding: 14px 16px; }
    .ct__kpi-num { font-size: var(--fs-kpi); font-weight: 700; color: var(--text); line-height: 1.05; font-variant-numeric: tabular-nums; }
    .ct__kpi-label { color: var(--muted); font-size: var(--fs-base); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; font-weight: 600; }
    .ct__kpi.is-risk { border-left-color: var(--danger); }
    .ct__kpi.is-risk .ct__kpi-num { color: var(--danger); }
    /* Subtle, professional pulse — NOT a flash. Disabled when the user prefers reduced motion. */
    .ct__kpi.is-risk::after { content: ''; position: absolute; top: 14px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: ct-pulse 2.2s ease-in-out infinite; }
    @keyframes ct-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .ct__kpi.is-risk::after { animation: none; } }

    /* Two-column scanning grid -------------------------------------------------------------- */
    .ct__grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; align-items: start; }
    @media (max-width: 980px) { .ct__grid, .ct__kpis { grid-template-columns: 1fr 1fr; } }

    .ct__panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 18px; }
    .ct__panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 14px; }
    .ct__panel-title { font-size: var(--fs-head); font-weight: 600; color: var(--text); margin: 0; text-transform: uppercase; letter-spacing: 0.08em; }
    .ct__panel-hint { color: var(--dim); font-size: var(--fs-base); }
    .ct__panel > p.ct__panel-hint { margin: -6px 0 14px; }

    /* Map ----------------------------------------------------------------------------------- */
    .ct__map { width: 100%; height: 300px; background: var(--panel-2); border-radius: 6px; border: 1px solid var(--border-soft); display: block; }
    .ct__legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: var(--fs-base); }
    .ct__legend span { display: inline-flex; align-items: center; gap: 6px; }
    .ct__sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    /* Tables -------------------------------------------------------------------------------- */
    .ct__table { width: 100%; border-collapse: collapse; font-size: var(--fs-base); font-variant-numeric: tabular-nums; }
    .ct__table th { text-align: left; color: var(--dim); font-weight: 600; font-size: var(--fs-base); text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .ct__table td { padding: 9px 10px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; color: var(--text); }
    .ct__table tr.is-impacted td { background: var(--danger-bg); box-shadow: inset 3px 0 0 var(--danger); }
    .ct__table tr.is-selected td { background: var(--info-bg); }
    .ct__mono { font-family: var(--font-mono); font-size: var(--fs-base); color: var(--muted); }
    .ct__linklike { background: none; border: none; color: var(--slate); font-weight: 600; cursor: pointer; padding: 0; font: inherit; }
    .ct__linklike:hover { color: var(--brand-bright); text-decoration: underline; }

    /* Criticality meter --------------------------------------------------------------------- */
    .ct__crit { display: inline-flex; align-items: center; gap: 8px; }
    .ct__crit-bar { width: 64px; height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; }
    .ct__crit-fill { height: 100%; background: var(--danger); }

    /* Forms --------------------------------------------------------------------------------- */
    .ct__field { display: grid; gap: 6px; margin-bottom: 12px; }
    .ct__field label { font-weight: 600; color: var(--muted); font-size: var(--fs-base); text-transform: uppercase; letter-spacing: 0.05em; }
    .ct__input, .ct__select { padding: 9px 11px; font-size: var(--fs-base); border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); color: var(--text); font-family: inherit; }
    .ct__input:focus, .ct__select:focus { outline: 2px solid var(--brand); outline-offset: 0; }
    .ct__input::placeholder { color: var(--dim); }
    .ct__form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .ct__btn { padding: 9px 15px; border-radius: 6px; border: 1px solid var(--brand); background: var(--brand); color: #fff; font-weight: 600; font-size: var(--fs-base); letter-spacing: 0.03em; cursor: pointer; font-family: inherit; }
    .ct__btn:hover { background: var(--brand-dark); }
    .ct__btn--ghost { background: transparent; color: var(--text); border-color: var(--border); }
    .ct__btn--danger { background: var(--danger); border-color: var(--danger); }
    .ct__btn--warn { background: var(--warn); border-color: var(--warn); color: #1b2026; }
    .ct__btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .ct__btns { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Recommendation / option rows ---------------------------------------------------------- */
    .ct__opt { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 9px; background: var(--panel-2); }
    .ct__opt.is-best { border-left: 3px solid var(--slate); }
    .ct__opt-icon { font-size: 1.2rem; }
    .ct__opt-title { font-weight: 600; color: var(--text); }
    .ct__opt-just { color: var(--muted); font-size: var(--fs-base); }
    .ct__opt-figs { display: flex; gap: 14px; font-size: var(--fs-base); color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
    .ct__opt-figs b { color: var(--text); font-weight: 700; }

    /* Messages / chips / states ------------------------------------------------------------- */
    .ct__msg { padding: 10px 14px; border-radius: 6px; font-weight: 600; margin-bottom: 16px; border-left: 3px solid; }
    .ct__msg--ok { background: var(--success-bg); color: var(--success); border-left-color: var(--success); }
    .ct__msg--err { background: var(--danger-bg); color: var(--danger); border-left-color: var(--danger); }
    .ct__empty { text-align: center; color: var(--dim); padding: 22px; font-size: var(--fs-base); }
    .ct__chip { display: inline-block; padding: 2px 9px; border-radius: 4px; font-size: var(--fs-base); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .ct__chip--high { background: var(--danger-bg); color: var(--danger); }
    .ct__chip--medium { background: var(--warn-bg); color: var(--warn); }
    .ct__chip--low { background: var(--success-bg); color: var(--success); }

    /* StatusBadge (shared kit) re-skinned for the dark theme. Meaning carried by icon + shape +
       label + colour together — never colour alone. */
    .ct .ws-badge { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); font-weight: 600; }
    .ct .ws-badge--success { color: var(--success); }
    .ct .ws-badge--info { color: var(--slate); }
    .ct .ws-badge--warn { color: var(--warn); }
    .ct .ws-badge--danger { color: var(--danger); }
    .ct .ws-badge--neutral { color: var(--muted); }
  </style>
</head>
<body>
  <main class="ct" id="control-tower"></main>
  <script type="module" src="./control-tower.js"></script>
</body>
</html>

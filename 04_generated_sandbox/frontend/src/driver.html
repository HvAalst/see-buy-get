<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PUDO · Driver</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./components/components.css" />
  <link rel="stylesheet" href="./fonts.css" />
  <style>
    /* PUDO Driver App — scan a vehicle to start a shift, find work on a route, claim + load. PostNL-
       inspired (see glos_brand_palette): white canvas, indigo primary + orange accent, swoosh header,
       Mulish. Large targets kept for field use. */
    :root {
      --pnl-indigo: #4c46e0; --pnl-indigo-dk: #3a34c2; --pnl-orange: #ff6200; --pnl-orange-dk: #dc4405;
      --pnl-green: #1fa45a; --pnl-amber: #ffab00; --pnl-ink: #1a1a1a; --pnl-muted: #5a5a64;
      --pnl-border: #e2e2e6; --pnl-border-strong: #c9c9d0;
      --pnl-font: 'PostNL', 'Mulish', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    .dv { max-width: 560px; margin: 0 auto; min-height: 100vh; background: #fff; font-family: var(--pnl-font); -webkit-font-smoothing: antialiased; }
    .dv__top { background: #fff; border-top: 4px solid; border-image: linear-gradient(90deg, var(--pnl-amber), var(--pnl-orange) 40%, var(--pnl-indigo) 75%, var(--pnl-green)) 1; border-bottom: 1px solid var(--pnl-border); padding: 13px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 5; }
    .dv__brand { font-weight: 800; letter-spacing: -0.01em; font-size: 1.1rem; color: #172b6b; }
    .dv__brand span { color: var(--pnl-muted); font-weight: 600; margin-left: 8px; font-size: 0.82rem; }
    .dv__right { display: flex; align-items: center; gap: 14px; }
    .dv__hub { color: var(--pnl-indigo); font-weight: 700; font-size: 0.85rem; text-decoration: none; }
    .dv__status { display: inline-flex; align-items: center; gap: 7px; font-size: 0.8rem; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: rgba(76,70,224,0.1); color: var(--pnl-indigo); }
    .dv__status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pnl-green); }
    .dv__status-dot--off { background: var(--pnl-orange); }
    .dv__body { padding: 20px; display: grid; gap: 16px; }

    .dv__veh { background: #fff; border: 1px solid var(--pnl-border); border-radius: 14px; padding: 18px; display: grid; gap: 12px; box-shadow: 0 1px 2px rgba(20,20,40,0.04); }
    .dv__veh-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .dv__veh-plate { font-weight: 800; color: #172b6b; letter-spacing: -0.01em; font-size: 1.1rem; font-family: 'SF Mono', Consolas, monospace; }
    .dv__veh-class { color: var(--pnl-muted); font-size: 0.85rem; text-transform: capitalize; }
    .dv__cap-bar { height: 10px; border-radius: 999px; background: var(--pnl-border); overflow: hidden; }
    .dv__cap-bar > span { display: block; height: 100%; background: var(--pnl-indigo); }
    .dv__cap-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--pnl-muted); }
    .dv__cap-row b { color: var(--pnl-ink); }

    .dv__actions { display: grid; gap: 12px; }
    .dv__action { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; background: #fff; border: 1px solid var(--pnl-border); border-radius: 14px; padding: 18px; cursor: pointer; transition: border-color 120ms, box-shadow 120ms; }
    .dv__action:hover:not(:disabled) { border-color: var(--pnl-indigo); box-shadow: 0 4px 14px rgba(20,20,40,0.06); }
    .dv__action:disabled { opacity: 0.45; cursor: not-allowed; }
    .dv__action-ic { width: 46px; height: 46px; border-radius: 12px; background: rgba(255,98,0,0.12); display: grid; place-items: center; flex: none; }
    .dv__action-ic svg { width: 24px; height: 24px; stroke: var(--pnl-orange); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dv__action-t { font-weight: 800; color: var(--pnl-ink); font-size: 1.05rem; }
    .dv__action-s { color: var(--pnl-muted); font-size: 0.85rem; margin-top: 2px; }
    .dv__badge { background: var(--pnl-orange); color: #fff; border-radius: 999px; min-width: 22px; height: 22px; padding: 0 7px; display: grid; place-items: center; font-size: 0.78rem; font-weight: 800; }

    .dv__card { background: #fff; border: 1px solid var(--pnl-border); border-radius: 14px; padding: 18px; display: grid; gap: 14px; box-shadow: 0 1px 2px rgba(20,20,40,0.04); }
    .dv__head { display: flex; align-items: center; gap: 12px; }
    .dv__back { border: 1.5px solid #4c46e0; background: #fff; border-radius: 8px; padding: 9px 14px; font-weight: 700; cursor: pointer; color: #4c46e0; font-family: inherit; }
    .dv__title { font-size: 1.2rem; font-weight: 800; color: #172b6b; letter-spacing: -0.01em; margin: 0; }
    .dv__step { display: grid; gap: 8px; }
    .dv__step-label { font-weight: 800; color: #172b6b; font-size: 0.9rem; }
    .dv__select, .dv__input { min-height: 54px; padding: 14px 16px; font-size: 1.05rem; border: 1.5px solid #c9c9d0; border-radius: 10px; width: 100%; background: #fff; color: var(--pnl-ink); font-family: inherit; }
    .dv__select:focus, .dv__input:focus { outline: none; border-color: #4c46e0; box-shadow: 0 0 0 3px rgba(76,70,224,0.16); }
    .dv__select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #5a5a64 50%), linear-gradient(135deg, #5a5a64 50%, transparent 50%); background-position: calc(100% - 20px) calc(50% - 2px), calc(100% - 14px) calc(50% - 2px); background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
    .dv__primary { width: 100%; padding: 15px; border: none; border-radius: 10px; background: #4c46e0; color: #fff; font-weight: 800; font-size: 1.05rem; cursor: pointer; font-family: inherit; }
    .dv__primary:hover { background: #3a34c2; }
    .dv__primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .dv__ghost { width: 100%; padding: 12px; border: 1.5px solid #4c46e0; border-radius: 12px; background: #fff; color: #4c46e0; font-weight: 700; cursor: pointer; font-family: inherit; }
    .dv__msg { padding: 13px 16px; border-radius: 10px; font-weight: 700; border-left: 4px solid; }
    .dv__msg--ok { background: rgba(31,164,90,0.14); color: var(--pnl-green); border-color: var(--pnl-green); }
    .dv__msg--err { background: rgba(220,68,5,0.1); color: var(--pnl-orange-dk); border-color: var(--pnl-orange-dk); }
    .dv__notice { padding: 12px 16px; border-radius: 10px; font-weight: 700; font-size: 0.92rem; border-left: 4px solid var(--pnl-amber); background: rgba(255,171,0,0.18); color: #9a6a00; }
    .dv__hint { font-family: 'SF Mono', Consolas, monospace; font-size: 0.78rem; color: var(--pnl-muted); }

    .dv__offer { border: 1px solid var(--pnl-border); border-left: 4px solid var(--pnl-indigo); border-radius: 12px; padding: 16px; display: grid; gap: 10px; background: #fff; }
    .dv__offer-msg { font-weight: 800; color: var(--pnl-ink); font-size: 1.0rem; line-height: 1.35; }
    .dv__offer-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.82rem; color: var(--pnl-muted); }
    .dv__offer-meta b { color: var(--pnl-ink); }
    .dv__offer-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .dv__claim { padding: 12px; border: none; border-radius: 10px; background: var(--pnl-indigo); color: #fff; font-weight: 800; cursor: pointer; font-family: inherit; }
    .dv__claim:hover { background: var(--pnl-indigo-dk); }
    .dv__ignore { padding: 12px; border: 1.5px solid var(--pnl-border-strong); border-radius: 10px; background: #fff; color: var(--pnl-muted); font-weight: 700; cursor: pointer; font-family: inherit; }

    .dv__load { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--pnl-border); border-radius: 12px; background: #fff; }
    .dv__load-code { font-family: 'SF Mono', Consolas, monospace; font-weight: 800; color: var(--pnl-ink); }
    .dv__load-meta { color: var(--pnl-muted); font-size: 0.84rem; }
    .dv__load-btn { margin-left: auto; padding: 9px 14px; border: 1.5px solid var(--pnl-indigo); border-radius: 8px; background: #fff; color: var(--pnl-indigo); font-weight: 700; cursor: pointer; font-family: inherit; }
  </style>
</head>
<body>
  <main class="dv" id="driver"></main>
  <script type="module" src="./driver.js"></script>
</body>
</html>

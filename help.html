<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SeeBuyGet help has moved</title>
<!--
  The help has moved to /help/ on the front door, one page per article (2026-10-22). This page sends every old link on:
  help.html#<article> to /help/<article>/, anything else to /help/. Without script, the link below does it.
-->
<meta name="robots" content="noindex" />
<link rel="canonical" href="/help/" />
<meta http-equiv="refresh" content="3; url=/help/" />
<script>
  (function () {
    var id = (location.hash || '').replace(/^#/, '');
    location.replace(/^[a-z0-9-]+$/.test(id) ? '/help/' + id + '/' : '/help/');
  })();
</script>
<style>
  body { margin: 0; padding: 40px 24px; font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #14181f; background: #f4f6f8; }
  a { color: #4c46e0; font-weight: 700; }
</style>
</head>
<body>
<p>SeeBuyGet help has moved. <a href="/help/">Open the help</a>.</p>
</body>
</html>
